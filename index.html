<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatGPT Clone</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, sans-serif;
}

body{
    background:#202123;
    color:white;
    height:100vh;
    display:flex;
}

.sidebar{
    width:260px;
    background:#171717;
    padding:20px;
    display:flex;
    flex-direction:column;
}
.sidebar-brand{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:20px;
}

.sidebar-brand .logo{
    width:40px;
    height:40px;
    display:block;
}

.sidebar h2{
    margin:0;
    text-transform:uppercase;
    letter-spacing:1px;
}

.sidebar-search{
    margin-bottom:20px;
}

.sidebar-search input{
    width:100%;
    padding:10px;
    border:1px solid #2f3136;
    border-radius:8px;
    background:#1c1c1f;
    color:white;
    outline:none;
}

.sidebar-menu{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:20px;
}

.menu-btn{
    width:100%;
    padding:12px 14px;
    border:none;
    border-radius:10px;
    background:#202228;
    color:white;
    text-align:left;
    cursor:pointer;
    font-size:14px;
}

.menu-btn:hover{
    background:#2a2d33;
}

.new-chat{
    width:100%;
    padding:10px;
    border:none;
    background:#10a37f;
    color:white;
    border-radius:5px;
    cursor:pointer;
    margin-top:auto;
}

.chat-container{
    flex:1;
    display:flex;
    flex-direction:column;
}

.header{
    background:rgb(189, 189, 133);
    padding:15px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.chat-box{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    max-width:75%;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    line-height:1.5;
}

.user{
    background:#a34610;
    margin-left:auto;
}

.bot{
    background:#444654;
}

.input-area{
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:15px;
    background:#343541;
}

.tool-status{
    font-size:13px;
    color:#cfd6e2;
    padding:8px 10px;
    border-radius:8px;
    background:#2f3136;
}

.input-row{
    display:flex;
}

#userInput{
    flex:1;
    padding:12px;
    border:none;
    border-radius:6px;
    outline:none;
    font-size:16px;
}

button{
    margin-left:10px;
    padding:12px 20px;
    border:none;
    background:#10a37f;
    color:white;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#608c0d;
}
.sidebar-ai{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:20px;
}

.sidebar-ai h3{
    margin:0;
    font-size:13px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:#a5a5a5;
}

.ai-btn{
    width:100%;
    padding:10px 14px;
    border:none;
    border-radius:10px;
    background:#202228;
    color:white;
    text-align:left;
    cursor:pointer;
    font-size:14px;
}

.sidebar-api{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:20px;
}

.api-label{
    font-size:12px;
    color:#a5a5a5;
    text-transform:uppercase;
    letter-spacing:0.8px;
}

.api-input{
    width:100%;
    padding:10px 12px;
    border:1px solid #2f3136;
    border-radius:8px;
    background:#1c1c1f;
    color:white;
}

.api-input:focus{
    outline:1px solid #10a37f;
}

.api-info{
    font-size:13px;
    color:#cfd6e2;
    padding:8px 10px;
    border-radius:8px;
    background:#2f3136;
}

.ai-btn:hover,
.ai-btn.active{
    background:#2a2d33;
}</style>
</head>
<body>

<div class="sidebar">
    <h2>kuttyai</h2>
    <div class="sidebar-search">
        <input type="text" id="sidebarSearch" placeholder="Search chat">
    </div>
    <div class="sidebar-menu">
        <button class="menu-btn">Chat</button>
        <button class="menu-btn">Library</button>
        <button class="menu-btn">Projects</button>
        <button class="menu-btn">Apps</button>
        <button class="menu-btn">Codex</button>
        <button class="menu-btn">More</button>
    </div>
    <div class="sidebar-ai">
        <h3>AI Tools</h3>
        <button class="ai-btn" data-tool="summarize">Summarize</button>
        <button class="ai-btn" data-tool="explain">Explain</button>
        <button class="ai-btn" data-tool="translate">Translate</button>
        <button class="ai-btn" data-tool="grammar">Correct Grammar</button>
    </div>
    <div class="sidebar-api">
        <label class="api-label" for="apiKeyInput">OpenAI API Key</label>
        <input id="apiKeyInput" class="api-input" type="password" placeholder="sk-...">
        <div class="api-info" id="apiStatus">API not connected</div>
    </div>
    <button class="new-chat" onclick="newChat()">+ New Chat</button>
</div>

<div class="chat-container">
    <div class="header">kuttyai</div>

    <div class="chat-box" id="chatBox">
        <div class="message bot">
            Hello! How can I help you today?
        </div>
    </div>

    <div class="input-area">
        <div class="tool-status" id="toolStatus">AI tool: None</div>
        <div class="input-row">
            <input type="text" id="userInput" placeholder="Send a message..."
                   onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>

<script>
const chatBox = document.getElementById("chatBox");
const toolStatus = document.getElementById("toolStatus");
const apiStatus = document.getElementById("apiStatus");
const apiKeyInput = document.getElementById("apiKeyInput");
let selectedTool = null;
const toolLabels = {
    summarize: "Summarize",
    explain: "Explain",
    translate: "Translate",
    grammar: "Correct Grammar"
};

document.querySelectorAll(".ai-btn").forEach(button => {
    button.addEventListener("click", () => setAiTool(button.dataset.tool));
});
apiKeyInput.addEventListener("input", updateApiStatus);
updateApiStatus();

async function sendMessage() {
    let input = document.getElementById("userInput");
    let text = input.value.trim();

    if (text === "") return;
    if (input.disabled) return;

    addMessage(text, "user");
    input.value = "";

    const activeTool = selectedTool;
    selectedTool = null;
    updateToolStatus();

    if (apiKeyInput.value.trim()) {
        addMessage("Thinking...", "bot");
        const botMsg = chatBox.querySelector(".message.bot:last-child");
        const reply = await callOpenAi(text, activeTool).catch(err => {
            console.error(err);
            return "Unable to reach the AI API. Please check your key and internet connection.";
        });
        if (botMsg) botMsg.remove();
        addMessage(reply, "bot");
    } else {
        setTimeout(() => {
            let reply = generateReply(text, activeTool);
            addMessage(reply, "bot");
        }, 600);
    }
}

function addMessage(text, type) {
    let msg = document.createElement("div");
    msg.classList.add("message", type);
    msg.textContent = text;

    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;
}

function updateToolStatus() {
    toolStatus.textContent = selectedTool ? `AI tool: ${toolLabels[selectedTool]}` : "AI tool: None";
}

function updateApiStatus() {
    const hasKey = apiKeyInput.value.trim().length > 0;
    apiStatus.textContent = hasKey ? "API key loaded" : "API not connected";
    apiStatus.style.backgroundColor = hasKey ? "#103c2c" : "#2f3136";
}

function setAiTool(tool) {
    selectedTool = selectedTool === tool ? null : tool;
    updateToolStatus();
    document.querySelectorAll(".ai-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tool === selectedTool);
    });
}

function generateReply(message, tool) {
    if (tool) return runAiTool(tool, message);
    const normalized = message.toLowerCase();

    if (normalized.includes("hello") || normalized.includes("hi"))
        return "Hello! I'm here to help with AI suggestions, code ideas, and quick explanations.";

    if (normalized.includes("name"))
        return "I am your AI Assistant, ready to help with chat, summaries, and coding questions.";

    if (normalized.includes("html"))
        return "HTML is used to create the structure and content of a web page, like headings, text, and buttons.";

    if (normalized.includes("css"))
        return "CSS styles your page, controlling colors, layout, spacing, and the look of buttons and text.";

    if (normalized.includes("javascript"))
        return "JavaScript adds interactivity to a page, handling clicks, form input, and dynamic content updates.";

    if (normalized.includes("explain"))
        return "Sure! Ask me to explain anything specific like HTML, CSS, JavaScript, or how the chat works.";

    if (normalized.includes("idea") || normalized.includes("project") || normalized.includes("suggest"))
        return "Try selecting an AI tool on the left for summaries, explanations, translations, or grammar correction.";

    return "This demo now supports real AI API responses when you enter your OpenAI key in the sidebar.";
}

async function callOpenAi(text, tool) {
    const apiKey = apiKeyInput.value.trim();
    const endpoint = "https://api.openai.com/v1/chat/completions";
    const messages = [{ role: "system", content: "You are a helpful AI assistant." }];
    const promptText = tool ? buildToolPrompt(tool, text) : text;

    messages.push({ role: "user", content: promptText });

    const response = await fetch(endpoint, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${apiKey}`
        },
        body: JSON.stringify({
            model: "gpt-3.5-turbo",
            messages,
            max_tokens: 250,
            temperature: 0.8
        })
    });

    if (!response.ok) {
        const errorText = await response.text();
        throw new Error(`API ${response.status}: ${errorText}`);
    }

    const data = await response.json();
    return data.choices?.[0]?.message?.content?.trim() || "I didn't get a response from the AI API.";
}

function buildToolPrompt(tool, text) {
    switch (tool) {
        case "summarize":
            return `Summarize this text clearly and briefly:\n\n${text}`;
        case "explain":
            return `Explain this in a simple and friendly way:\n\n${text}`;
        case "translate":
            return `Translate this to Spanish:\n\n${text}`;
        case "grammar":
            return `Correct the grammar and punctuation of this text:\n\n${text}`;
        default:
            return text;
    }
}

function runAiTool(tool, text) {
    switch (tool) {
        case "summarize":
            return `Summary: ${summarizeText(text)}`;
        case "explain":
            return `Explanation: ${explainText(text)}`;
        case "translate":
            return `Translation (Spanish): ${translateText(text)}`;
        case "grammar":
            return `Corrected: ${correctGrammar(text)}`;
        default:
            return "AI tool not recognized.";
    }
}

function summarizeText(text) {
    let sentence = text.split(/[\.\?!]/)[0];
    if (sentence.length <= 80) return sentence.trim();
    return sentence.trim().slice(0, 80) + "...";
}

function explainText(text) {
    const lower = text.toLowerCase();
    if (lower.includes("html"))
        return "HTML is the foundation of a web page that organizes text, images, and interactive elements.";
    if (lower.includes("css"))
        return "CSS styles HTML content, setting colors, layout, spacing, and responsive design rules.";
    if (lower.includes("javascript"))
        return "JavaScript adds dynamic behavior to web pages, such as updating content and responding to clicks.";
    return "This tool gives a short, easy-to-understand explanation of the text you entered.";
}

function translateText(text) {
    const lower = text.toLowerCase();
    if (lower.includes("hello")) return "Hola";
    if (lower.includes("how are you")) return "¿Cómo estás?";
    if (lower.includes("thank you")) return "Gracias";
    return `Traducción al español: ${text}`;
}

function correctGrammar(text) {
    const trimmed = text.trim();
    if (!trimmed) return text;
    const fixed = trimmed.charAt(0).toUpperCase() + trimmed.slice(1);
    return fixed.replace(/\s+([,.!?])/g, "$1").replace(/([^.!?])$/, "$1.");
}

function newChat() {
    selectedTool = null;
    updateToolStatus();
    document.querySelectorAll(".ai-btn").forEach(btn => btn.classList.remove("active"));
    chatBox.innerHTML = `
        <div class="message bot">
            New chat started. How can I help you?
        </div>
    `;
}
</script>

</body>
</html>
